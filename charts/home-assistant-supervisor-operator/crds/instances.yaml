apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: homeassistantinstances.ha-operator.io}
spec:
  group: ha-operator.io
  scope: Namespaced
  names: {plural: homeassistantinstances, singular: homeassistantinstance, kind: HomeAssistantInstance}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: self.metadata.name == 'home-assistant'
              message: Only the home-assistant singleton name is allowed.
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              properties:
                trustPodNetwork: {type: boolean, default: false}
                httpProxy:
                  type: object
                  required: [trustedProxies]
                  properties:
                    trustedProxies:
                      type: array
                      maxItems: 128
                      items: {type: string, minLength: 1, maxLength: 100}
                desiredState: {type: string, enum: [Running, Stopped], default: Running}
                ownership: {type: string, enum: [Ui, GitOps], default: Ui}
                command:
                  type: object
                  required: [id, action]
                  properties:
                    id: {type: string, pattern: '^[a-f0-9]{32}$'}
                    action: {type: string, enum: [Start, Stop, Restart]}
                    requestKey: {type: string, nullable: true, maxLength: 128}
                    acceptedGeneration: {type: integer, format: int64, nullable: true, minimum: 1}
                options:
                  type: object
                  default: {timezone: UTC, country: US, port: 80, ssl: false, diagnostics: false}
                  properties:
                    timezone: {type: string, default: UTC, maxLength: 100}
                    country: {type: string, nullable: true, maxLength: 2, default: US}
                    port: {type: integer, minimum: 1, maximum: 65535, default: 80}
                    ssl: {type: boolean, default: false}
                    diagnostics: {type: boolean, default: false}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                hasManagedHttpProxy: {type: boolean}
                discoveredPodNetworks:
                  type: array
                  nullable: true
                  items: {type: string, minLength: 1, maxLength: 100}
                proxyCommandId: {type: string, nullable: true, pattern: '^[a-f0-9]{32}$'}
                proxyCommandNetworkRevision: {type: integer, format: int64, minimum: 0}
                podNetworkRevision: {type: integer, format: int64, minimum: 0}
                operationId: {type: string, nullable: true}
                state: {type: string, enum: [Unknown, Running, Stopped, Starting]}
                podUid: {type: string, nullable: true}
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ['True', 'False', Unknown]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64, nullable: true}
                      lastTransitionTime: {type: string, format: date-time}
