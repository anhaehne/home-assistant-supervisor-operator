apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: {name: homeassistantoperations.ha-operator.io}
spec:
  group: ha-operator.io
  scope: Namespaced
  names: {plural: homeassistantoperations, singular: homeassistantoperation, kind: HomeAssistantOperation}
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [id, targetUid, targetGeneration, action, desiredState, createdAt]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Accepted operation specifications are immutable.
              properties:
                id: {type: string, pattern: '^[a-f0-9]{32}$'}
                targetUid: {type: string, minLength: 1}
                targetGeneration: {type: integer, format: int64, minimum: 1}
                action: {type: string, enum: [Reconcile, Start, Stop, Restart]}
                desiredState: {type: string, enum: [Running, Stopped]}
                createdAt: {type: string, format: date-time}
            status:
              type: object
              properties:
                phase: {type: string, enum: [Accepted, ApplyingHttpConfiguration, Stopping, Starting, WaitingForHealth, Succeeded, Failed]}
                error: {type: string, nullable: true, maxLength: 4096}
                completedAt: {type: string, nullable: true, format: date-time}
                startedAt: {type: string, nullable: true, format: date-time}
                httpProxyFingerprint: {type: string, nullable: true, pattern: '^[A-Fa-f0-9]{64}$'}
                httpProxyStagedPodUid: {type: string, nullable: true}
