{{- if eq (include "haso.trustPodNetwork" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: supervisor-pod-network
rules:
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: supervisor-pod-network
subjects:
  - {kind: ServiceAccount, name: supervisor, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: supervisor-pod-network}
{{- end }}
