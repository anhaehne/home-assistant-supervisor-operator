apiVersion: v1
kind: ConfigMap
metadata:
  name: core-config
  namespace: haso-p0
data:
  configuration.yaml: |
    default_config:
    homeassistant:
      name: P0 Compatibility Test
      time_zone: UTC
      country: US
    logger:
      default: warning
      logs:
        homeassistant.components.hassio: info
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: operator-state
  namespace: haso-p0
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 64Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supervisor
  namespace: haso-p0
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: supervisor}
  template:
    metadata:
      labels: {app: supervisor}
    spec:
      serviceAccountName: supervisor
      automountServiceAccountToken: true
      securityContext: {runAsUser: 1654, runAsGroup: 1654, fsGroup: 1654}
      containers:
        - name: supervisor
          image: haso/operator:p0
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: Supervisor__CoreToken
              valueFrom:
                secretKeyRef: {name: credentials, key: core-token}
            - {name: Supervisor__StateDirectory, value: /state}
            - {name: Gateway__BaseUrl, value: 'http://core-gateway:8081'}
            - name: Gateway__Token
              valueFrom:
                secretKeyRef: {name: credentials, key: gateway-token}
            - {name: Instance__CoreVersion, value: 2026.9.4}
            - name: Instance__NodeName
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: Instance__PodIp
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: Kubernetes__Namespace
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - {name: Kubernetes__UseInClusterCredentials, value: 'true'}
            - {name: Operator__EnableFrameworkProbe, value: 'true'}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health/live, port: http}
          livenessProbe:
            httpGet: {path: /health/live, port: http}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: operator-state}
        - {name: temp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: supervisor
  namespace: haso-p0
spec:
  selector: {app: supervisor}
  ports:
    - {port: 80, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core
  namespace: haso-p0
spec:
  replicas: 1
  serviceName: core
  updateStrategy: {type: OnDelete}
  selector:
    matchLabels: {app: core}
  template:
    metadata:
      labels: {app: core}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: core
          image: ghcr.io/home-assistant/home-assistant:2026.9.4
          imagePullPolicy: Never
          ports:
            - {name: core-http, containerPort: 80}
          env:
            - {name: SUPERVISOR, value: supervisor}
            - name: SUPERVISOR_TOKEN
              valueFrom:
                secretKeyRef: {name: credentials, key: core-token}
            - {name: SUPERVISOR_CORE_API_SOCKET, value: /run/supervisor/core.sock}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          startupProbe:
            httpGet: {path: /, port: core-http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /, port: core-http}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: configuration, mountPath: /config/configuration.yaml, subPath: configuration.yaml, readOnly: true}
            - {name: socket, mountPath: /run/supervisor}
        - name: gateway
          image: haso/gateway:p0
          imagePullPolicy: Never
          ports:
            - {name: gateway-http, containerPort: 8081}
          env:
            - name: Gateway__Token
              valueFrom:
                secretKeyRef: {name: credentials, key: gateway-token}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /health/live, port: gateway-http}
          volumeMounts:
            - {name: socket, mountPath: /run/supervisor, readOnly: true}
            - {name: temp, mountPath: /tmp}
      volumes:
        - {name: configuration, configMap: {name: core-config}}
        - {name: socket, emptyDir: {}}
        - {name: temp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: haso-p0
spec:
  selector: {app: core}
  ports:
    - {port: 80, targetPort: core-http}
---
apiVersion: v1
kind: Service
metadata:
  name: core-gateway
  namespace: haso-p0
spec:
  publishNotReadyAddresses: true
  selector: {app: core}
  ports:
    - {port: 8081, targetPort: gateway-http}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: supervisor
  namespace: haso-p0
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-metrics
  namespace: haso-p0
rules:
  - apiGroups: ['']
    resources: [pods/exec]
    resourceNames: [core-0]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-metrics
  namespace: haso-p0
subjects:
  - {kind: ServiceAccount, name: supervisor, namespace: haso-p0}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: core-metrics}
