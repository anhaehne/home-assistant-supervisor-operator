apiVersion: v1
kind: ConfigMap
metadata:
  name: framework-probe-state
  namespace: haso-p0
data: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: framework-probe
  namespace: haso-p0
rules:
  - apiGroups: [spikes.ha-operator.io]
    resources: [frameworkprobes]
    verbs: [get, list, watch, update]
  - apiGroups: [spikes.ha-operator.io]
    resources: [frameworkprobes/status]
    verbs: [get, update]
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [framework-probe-state]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: framework-probe
  namespace: haso-p0
subjects:
  - {kind: ServiceAccount, name: supervisor, namespace: haso-p0}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: framework-probe}
