# Disposable P1 framework acceptance schema; not a production instance contract.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: frameworkprobes.spikes.ha-operator.io
spec:
  group: spikes.ha-operator.io
  scope: Namespaced
  names:
    plural: frameworkprobes
    singular: frameworkprobe
    kind: FrameworkProbe
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          x-kubernetes-validations:
            - rule: self.metadata.name == 'framework'
              message: The disposable framework probe must be named framework.
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [value]
              properties:
                value: {type: string, minLength: 1, maxLength: 128}
                hold: {type: boolean, default: false}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64, minimum: 0}
                phase: {type: string, enum: [Accepted, Completed]}
